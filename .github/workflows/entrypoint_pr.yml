name: External PR tests

on:
  pull_request:
    branches:
      - dev
      - "*.*.*"
      - "*.*.*b*"
    paths-ignore: # not always respected. See https://github.com/actions/runner/issues/2324#issuecomment-1703345084
      - ".github/**"
      - "**.md"

env:
  # fake local registry for PR images
  FAKE_LOCAL_REGISTRY: "nwodtuhs/exegol-local"

  IMAGE_TARGET_REGISTRY: "nwodtuhs/exegol-preprod"
  DOCKERFILE: "./Dockerfile"

# creating a separate concurrency group for each PR
# so that our "PR checks" are always running for the latest commit in the PR
# and as PRs are updated we want to make sure "in progress" jobs are killed so we don't waste resources
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  init:
    name: Initialize
    runs-on: self-hosted
    outputs:
      FAKE_LOCAL_REGISTRY: ${{ steps.varset.outputs.FAKE_LOCAL_REGISTRY }}
      IMAGE_TAG: ${{ steps.varset.outputs.IMAGE_TAG }}
      DOCKERFILE: ${{ steps.varset.outputs.DOCKERFILE }}
    steps:
      - name: Setting variables
        id: varset
        run: |
          PR_NUMBER=$(echo ${{ github.ref }} | awk 'BEGIN { FS = "/" } ; { print $3 }')
          echo "FAKE_LOCAL_REGISTRY=${{ env.FAKE_LOCAL_REGISTRY }}" >> $GITHUB_OUTPUT
          echo "IMAGE_TAG=PR${PR_NUMBER}" >> $GITHUB_OUTPUT
          echo "DOCKERFILE=${{ env.DOCKERFILE }}" >> $GITHUB_OUTPUT
          cat $GITHUB_OUTPUT

  code_check:
    name: Code compliance check
    needs: init
    runs-on: [self-hosted]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check colorecho
        run: python3 ~/exegol-pipelines-tools/code_compliance_check.py colorecho
      - name: Check add-aliases
        run: python3 ~/exegol-pipelines-tools/code_compliance_check.py add-aliases
      - name: Check add-history
        run: python3 ~/exegol-pipelines-tools/code_compliance_check.py add-history
      - name: Check add-test-command
        run: python3 ~/exegol-pipelines-tools/code_compliance_check.py add-test-command
      - name: Check add-to-list
        run: python3 ~/exegol-pipelines-tools/code_compliance_check.py add-to-list
      - name: Temp-fix check
        run: python3 ~/exegol-pipelines-tools/code_compliance_check.py temp-fix
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38
        env:
          SHELLCHECK_OPTS: -e SC1071 -e SC2148 -e SC1090 -e SC1091 -e SC2317
        with:
          ignore_names: >-
            zshrc
            bashrc

  # One matrix leg = one arch end-to-end (build → test → CSV → clean).
  # GitHub Actions does not support per-matrix-leg `needs`, so a separate
  # `test` job with `needs: [build]` waits for ALL arches before any test
  # starts. Keeping the pipeline in one job makes each arch independent:
  # arm64 can upload its CSV while amd64 is still building.
  image:
    name: Build and test
    needs: [ init, code_check ]
    if: needs.code_check.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        arch: [ arm64, amd64 ]
    # Build+test on the arch builder host (same machines previously used for
    # both `builder` and `tester` labels; image stays local via load: true).
    runs-on:
      - self-hosted
      - builder
      - ${{ matrix.arch }}
    timeout-minutes: 360
    env:
      # Refuse to start a multi-hour no-cache build if the runner is already tight on space
      MIN_FREE_GB: "50"
    steps:
      # --- Preflight (mirrors Exegol-pipelines sub_preflight / sub_build_belt prune) ---
      - name: Show disk and docker usage
        run: |
          set -euo pipefail
          echo "[*] df -h"
          df -h
          echo "[*] docker system df"
          docker system df || true
          echo "[*] docker image ls"
          docker image ls
      - name: Prune dangling build data
        run: |
          set -euo pipefail
          # Dangling only: --all would drop cache still usable by concurrent jobs
          # on the same runner.
          docker builder prune --force
          docker buildx prune --force 2>/dev/null || true
          docker image prune --force --filter "label=org.exegol.app=Exegol"
          docker volume prune --force
          # Leftover action-registry / build-push temp tars on the host
          if [[ -n "${GITHUB_WORKSPACE:-}" ]]; then
            find "${GITHUB_WORKSPACE}" -maxdepth 3 -type f -name '.docker_temp_*' -delete 2>/dev/null || true
          fi
          find "${HOME}/Projects/exegol-images/_work" -type f -name '.docker_temp_*' -delete 2>/dev/null || true
      - name: Require free disk space
        run: |
          set -euo pipefail
          echo "[*] df -h after prune"
          df -h
          echo "[*] docker system df after prune"
          docker system df || true

          DOCKER_ROOT="$(docker info --format '{{.DockerRootDir}}' 2>/dev/null || true)"
          TARGET="/"
          if [[ -n "${DOCKER_ROOT}" && -d "${DOCKER_ROOT}" ]]; then
            TARGET="${DOCKER_ROOT}"
          fi

          AVAIL_KB="$(df -Pk "${TARGET}" | awk 'NR==2 {print $4}')"
          AVAIL_GB="$((AVAIL_KB / 1024 / 1024))"
          echo "[*] ${AVAIL_GB}G free on ${TARGET} (minimum ${MIN_FREE_GB}G)"
          if [[ "${AVAIL_GB}" -lt "${MIN_FREE_GB}" ]]; then
            echo "[-] STORAGE: only ${AVAIL_GB}G free on ${TARGET}, need at least ${MIN_FREE_GB}G"
            echo "[-] Stopping before a multi-hour build fills the runner."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Prepare build
        id: prepare
        run: echo "BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_OUTPUT
      - name: Build the image
        if: success()
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          load: true
          no-cache: true
          build-args: |
            TAG=${{ needs.init.outputs.IMAGE_TAG }}
            VERSION=${{ needs.init.outputs.IMAGE_TAG }}
            BUILD_DATE=${{ steps.prepare.outputs.BUILD_DATE }}
          tags: "${{ env.FAKE_LOCAL_REGISTRY }}:${{ needs.init.outputs.IMAGE_TAG }}-${{ matrix.arch }}"
          platforms: linux/${{ matrix.arch }}
          file: ${{ needs.init.outputs.DOCKERFILE }}
          context: .

      - name: Inspect the image
        if: success()
        run: docker inspect ${{ env.FAKE_LOCAL_REGISTRY }}:${{ needs.init.outputs.IMAGE_TAG }}-${{ matrix.arch }}
      - name: Create a container from the built image
        if: success()
        run: |
          docker run --name exegol-unit-tests-${{ needs.init.outputs.IMAGE_TAG }}-${{ matrix.arch }} --rm -t -d ${{ env.FAKE_LOCAL_REGISTRY }}:${{ needs.init.outputs.IMAGE_TAG }}-${{ matrix.arch }} endless
      - name: Install GUI requirements
        if: success()
        run: |
          docker exec exegol-unit-tests-${{ needs.init.outputs.IMAGE_TAG }}-${{ matrix.arch }} bash -lc "apt update && apt install -y xvfb x11-utils xdotool imagemagick wmctrl"
      - name: Copy the unit tests script
        if: success()
        run: docker cp ~/exegol-pipelines-tools/run_unit_tests.py exegol-unit-tests-${{ needs.init.outputs.IMAGE_TAG }}-${{ matrix.arch }}:/.exegol/
      - name: Run the tests
        if: success()
        run: |
          docker exec exegol-unit-tests-${{ needs.init.outputs.IMAGE_TAG }}-${{ matrix.arch }} python3 /.exegol/run_unit_tests.py
      - name: Print the failed tests if any
        if: failure()
        run: |
          docker exec exegol-unit-tests-${{ needs.init.outputs.IMAGE_TAG }}-${{ matrix.arch }} cat /.exegol/unit_tests_failed_commands.log || true
      - name: Print the successful tests
        if: always()
        run: |
          docker exec exegol-unit-tests-${{ needs.init.outputs.IMAGE_TAG }}-${{ matrix.arch }} cat /.exegol/unit_tests_success_commands.log || true
      - name: Export installed_tools.csv
        if: always()
        run: |
          docker cp exegol-unit-tests-${{ needs.init.outputs.IMAGE_TAG }}-${{ matrix.arch }}:/.exegol/installed_tools.csv \
            installed_tools_${{ matrix.arch }}.csv \
            && head -n 5 installed_tools_${{ matrix.arch }}.csv \
            && wc -l installed_tools_${{ matrix.arch }}.csv \
            || true
      - name: Upload installed_tools.csv
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: installed-tools-${{ matrix.arch }}
          path: installed_tools_${{ matrix.arch }}.csv
          if-no-files-found: warn
      - name: Stop the container
        if: always()
        run: docker stop exegol-unit-tests-${{ needs.init.outputs.IMAGE_TAG }}-${{ matrix.arch }} || true

      # --- Post clean (mirrors Exegol-pipelines clean_runners) ---
      - name: List docker images
        if: always()
        run: docker image ls
      - name: Remove local image
        if: always()
        run: docker rmi ${{ env.FAKE_LOCAL_REGISTRY }}:${{ needs.init.outputs.IMAGE_TAG }}-${{ matrix.arch }} || true
      - name: Prune dangling data and leftover temps
        if: always()
        run: |
          set -euo pipefail
          # Dangling only so concurrent jobs keep their BuildKit cache
          docker builder prune --force || true
          docker buildx prune --force 2>/dev/null || true
          docker image prune --force || true
          if [[ -n "${GITHUB_WORKSPACE:-}" ]]; then
            find "${GITHUB_WORKSPACE}" -maxdepth 3 -type f -name '.docker_temp_*' -delete 2>/dev/null || true
          fi
          find "${HOME}/Projects/exegol-images/_work" -type f -name '.docker_temp_*' -delete 2>/dev/null || true
          docker system df || true
          df -h / || true
